services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mahalla
      POSTGRES_PASSWORD: mahalla
      POSTGRES_DB: mahalla
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahalla"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mahalla:mahalla@postgres:5432/mahalla
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:4000
    depends_on: [api]
    ports: ["3000:3000"]

  app:
    build: { context: ., dockerfile: apps/app/Dockerfile }
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata:
  miniodata:
